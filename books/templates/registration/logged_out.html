{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bye Bye - MyBookie</title>

    <link rel="stylesheet"
          href="{% static 'books/style.css' %}">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="auth-navbar">

        <img
            src="{% static 'books/assets/images/bookie_logo.png' %}"
            alt="MyBookie"
            class="auth-logo"
        >

        <a href="{% url 'login' %}"
           class="login-button">

            Login :))

        </a>

    </nav>


    <!-- LOGOUT INTERACTION -->

    <main class="logout-page">


        <!-- STATE 1 -->

        <section id="logout-state-1"
                 class="logout-state active">

            <h1>
                YOU WANT TO LOGOUT? NOOOOOOOOOOO
            </h1>


            <div class="logout-scene">


                <!-- ANGRY CAT -->

                <img
                    src="{% static 'books/assets/images/angry_cat.png' %}"
                    class="angry-cat"
                    alt="Angry Bookie"
                >


                <!-- COOKIE -->

                <button
                    id="cookie"
                    class="cookie"
                    onclick="giveCookie()">

                    🍪

                </button>

            </div>


            <p>
                Give Bookie a cookie first...
            </p>

        </section>



        <!-- STATE 2 -->

        <section id="logout-state-2"
                 class="logout-state">

            <h1>
                you know what? actually...
                nvm, bye bayy
            </h1>


            <div class="logout-scene">


                <!-- HAPPY CAT -->

                <img
                    src="{% static 'books/assets/images/happy_cat.png' %}"
                    class="happy-cat"
                    alt="Happy Bookie"
                >


                <!-- DOOR -->

                <button
                    class="door-button"
                    onclick="logoutUser()">

                    <img
                        src="{% static 'books/assets/images/door.png' %}"
                        alt="Logout"
                    >

                </button>

            </div>


            <p>
                Click the door to leave MyBookie...
            </p>

        </section>

    </main>



    <!-- HIDDEN LOGOUT FORM -->

    <form
        id="logout-form"
        action="{% url 'logout' %}"
        method="POST"
        style="display:none;">

        {% csrf_token %}

    </form>


    <script>

        function giveCookie() {

            const cookie =
                document.getElementById("cookie");

            const state1 =
                document.getElementById("logout-state-1");

            const state2 =
                document.getElementById("logout-state-2");


            // Cookie animation

            cookie.classList.add("cookie-moving");


            // Wait until animation finishes

            setTimeout(function() {

                state1.classList.remove("active");

                state2.classList.add("active");

            }, 1000);

        }


        function logoutUser() {

            document
                .getElementById("logout-form")
                .submit();

        }

    </script>

</body>

</html>
